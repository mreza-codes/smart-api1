apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-api
  template:
    metadata:
      labels:
        app: smart-api
    spec:
      containers:
      - name: smart-api-container
        image: smart-api:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 8000