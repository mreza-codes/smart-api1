name: CI/CD Pipeline for Smart API

# این پایپلاین با هر بار پوش کردن روی شاخه اصلی (main) یا مابقی شاخه‌ها فعال می‌شود
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # ۱. دریافت کدهای پروژه از گیت‌هاب
    - name: Checkout repository
      uses: actions/checkout@v4

    # ۲. راه‌اندازی محیط پایتون
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    # ۳. نصب پکیج‌ها و وابستگی‌ها
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # ۴. اجرای تست‌های سینتکس و سلامت پایتون (CI)
    - name: Run code check
      run: |
        echo "Running basic code validation..."
        python -c "import main; print('Main module imported successfully!')"

    # ۵. تست ساخت ایمیج داکر (CD Build Check)
    - name: Build Docker Image
      run: |
        docker build -t smart-api:test .
        echo "Docker image built successfully during CI/CD pipeline!"