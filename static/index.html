<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مانیتورینگ سنسورها — Smart API</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      background-color: #0f172a;
      color: #e2e8f0;
      max-width: 740px;
      margin: 36px auto;
      padding: 0 16px;
    }

    h1 {
      font-size: 22px;
      margin-bottom: 6px;
      color: #f8fafc;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* کادر هر بخش با فاصله بیشتر و حاشیه واضح‌تر */
    .box {
      background-color: #1e293b;
      border: 1px solid #475569;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 28px;
    }

    .box-header {
      font-size: 15px;
      font-weight: bold;
      color: #f8fafc;
      padding-bottom: 10px;
      margin-bottom: 16px;
      border-bottom: 1px solid #334155;
    }

    .row {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: end;
    }

    .row-between {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #334155;
    }

    label {
      display: block;
      font-size: 13px;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    input {
      padding: 9px 12px;
      border: 1px solid #64748b;
      background-color: #0f172a;
      color: #f8fafc;
      border-radius: 6px;
      font-size: 14px;
    }

    input:focus {
      outline: none;
      border-color: #38bdf8;
    }

    button {
      padding: 9px 16px;
      border: 1px solid #38bdf8;
      background-color: #0284c7;
      color: #ffffff;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    button.secondary {
      background-color: #0f172a;
      border-color: #64748b;
      color: #e2e8f0;
    }

    button:hover {
      opacity: 0.9;
    }

    .status {
      margin-top: 12px;
      font-size: 13px;
      color: #38bdf8;
      min-height: 18px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 6px;
    }

    th, td {
      border: 1px solid #334155;
      padding: 9px 12px;
      text-align: right;
      font-size: 14px;
    }

    th {
      background-color: #0f172a;
      color: #f8fafc;
    }

    td {
      color: #e2e8f0;
    }
  </style>
</head>
<body>
  <h1>مانیتورینگ سنسورها</h1>
  <div class="subtitle">ثبت و مشاهده آخرین داده‌های دما از طریق Smart API</div>

  <!-- بخش اول: فرم ثبت داده جدید -->
  <div class="box">
    <div class="box-header">بخش ۱: ثبت داده جدید سنسور</div>
    <form id="reading-form" class="row">
      <div>
        <label for="sensor-id">شناسه سنسور (sensor_id)</label>
        <input id="sensor-id" type="text" placeholder="مثلاً: sensor-1" required />
      </div>

      <div>
        <label for="temperature">دما (temperature)</label>
        <input id="temperature" type="number" step="any" placeholder="مثلاً: 24.5" required />
      </div>

      <div>
        <button type="submit">ثبت داده</button>
      </div>
    </form>
    <div id="status-msg" class="status"></div>
  </div>

  <!-- بخش دوم: جدول نمایش داده‌ها -->
  <div class="box">
    <div class="row-between">
      <strong>بخش ۲: آخرین داده‌های ثبت‌شده</strong>
      <button type="button" class="secondary" onclick="loadReadings()">به‌روزرسانی لیست</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>ردیف</th>
          <th>شناسه سنسور</th>
          <th>دما</th>
        </tr>
      </thead>
      <tbody id="readings-body">
        <tr>
          <td colspan="3">در حال بارگذاری...</td>
        </tr>
      </tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById("reading-form");
    const sensorInput = document.getElementById("sensor-id");
    const tempInput = document.getElementById("temperature");
    const statusMsg = document.getElementById("status-msg");
    const tableBody = document.getElementById("readings-body");

    // دریافت لیست آخرین داده‌ها از سرور
    async function loadReadings() {
      try {
        const response = await fetch("/readings");
        if (!response.ok) {
          throw new Error("خطا در دریافت اطلاعات");
        }

        const data = await response.json();
        tableBody.innerHTML = "";

        if (data.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="3">هنوز داده‌ای ثبت نشده است.</td></tr>';
          return;
        }

        data.forEach((item, index) => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${index + 1}</td>
            <td>${item.sensor_id}</td>
            <td>${item.temperature}</td>
          `;
          tableBody.appendChild(tr);
        });
      } catch (err) {
        tableBody.innerHTML = '<tr><td colspan="3">خطا در ارتباط با سرور</td></tr>';
      }
    }

    // ارسال داده جدید هنگام ثبت فرم
    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      const payload = {
        sensor_id: sensorInput.value.trim(),
        temperature: parseFloat(tempInput.value)
      };

      try {
        const response = await fetch("/readings", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          throw new Error("ثبت انجام نشد");
        }

        statusMsg.textContent = "داده با موفقیت ذخیره شد.";
        tempInput.value = "";
        loadReadings();
      } catch (err) {
        statusMsg.textContent = "خطا در ارسال داده به سرور.";
      }
    });

    // بارگذاری اولیه هنگام باز شدن صفحه
    loadReadings();
  </script>
</body>
</html>
